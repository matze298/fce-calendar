[project]
name = "fce-calendar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "resend",
    "supabase>=2.28.3",
]

# Kept out of [project.dependencies] because Vercel installs those into the serverless
# functions. uv installs this group by default for local work and CI.
[dependency-groups]
dev = [
    "prek",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff",
    "ty",
]
