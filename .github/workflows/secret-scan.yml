name: Secret Scan (gitleaks)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, so a credential that was committed and later removed is still caught.
        fetch-depth: 0

    - name: Scan git history for secrets
      run: |
        docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
          git /repo --no-banner --redact --config /repo/.gitleaks.toml
