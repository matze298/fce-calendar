name: Database Migrations (Supabase)

on:
  # No base-branch filter, so a pull request stacked on another branch is still checked.
  pull_request:

jobs:
  database-check:
    name: Database Migration Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned rather than "latest". Resolving "latest" needs an unauthenticated GitHub API call
          # that is rate limited per runner, which has already failed this job. A fixed version is
          # fetched from npm instead, so the job no longer depends on that quota, and a Supabase
          # release cannot change what CI runs without a commit here.
          version: 2.113.0

      - name: Start Supabase Local (Verification)
        run: |
          # Observed flake: the database container sometimes cannot bind port 54322 because it is
          # still held on the runner. Clean up and retry once rather than failing the whole run.
          if ! supabase db start; then
            echo "::warning::supabase db start failed, cleaning up and retrying once"
            supabase stop --no-backup || true
            docker ps -aq | xargs -r docker rm -f || true
            supabase db start
          fi

      - name: Apply Migrations
        # db start does not apply migrations. Without this the job lints an empty schema and a
        # migration chain that cannot apply passes.
        run: supabase db reset --local

      - name: Verify Migration Success
        run: |
          # Verify the database schema matches what's expected
          # This ensures no syntax errors in the SQL files
          supabase db lint

      - name: Verify Access Control Policies
        run: supabase test db --local supabase/tests
